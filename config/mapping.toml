# 회비 산출 자동화 - 로우데이터 → 계산파일 매핑 설정
#
# 이 파일만 고치면 어떤 로우데이터 값이 계산파일의 어느 항목(열)에 들어갈지 바꿀 수 있습니다.
#
# [[sources]] 하나가 로우데이터 시트 하나입니다.
#   key_column     : 피벗 행 영역 (기관코드 열)
#   ignore_columns : 피벗 값에서 뺄 열 (날짜, 기관명 등)
#   items          : 항목 이름 → column(계산파일 열) + sources(합산할 로우데이터 열)
#                    column 이 없는 항목은 계산파일에 넣지 않고 검토용 피벗 파일에만 남깁니다.
#   compare_with   : 다른 항목과 기관별 합계가 같은지 비교만 합니다 (검증용).
#
# 시트의 모든 값 열은 items 중 정확히 한 곳에 들어가거나 ignore_columns 에 있어야 합니다.
# 빠지거나 두 번 들어간 열이 있으면 프로그램이 멈추고 알려줍니다 (값이 조용히 누락되지 않도록).

[target]
sheet = "1. 실적"                    # 계산파일에서 값을 넣을 시트
code_column = "A"                    # 기관코드가 적힌 열
first_row = 4                        # 첫 기관 행
last_row = 67                        # 마지막 기관 행
total_row = 68                       # 합계 행

# 기관코드 합산 규칙 (계산파일 메모 기준): 왼쪽 코드의 실적을 오른쪽 코드에 더함
[code_merge]
"005" = "081"   # 외환 → 하나은행(081)
"230" = "238"   # 미래에셋대우증권(230) → 238

# ---------------------------------------------------------------------------
# 합계 수식: {r} 은 행 번호로 바뀝니다. 계산파일을 열면 자동으로 다시 계산됩니다.
# (Q 펌뱅킹 합계에는 N 펌해지내역중계, O·P 펌신규해지등록중계(배치·실시간)가 포함됨)
# ---------------------------------------------------------------------------
[row_formulas]
F = "SUM(C{r}:E{r})"          # 지로 합계
J = "SUM(G{r}:I{r})"          # CMS 합계
Q = "SUM(K{r}:P{r})"          # 펌뱅킹 합계
R = "F{r}+J{r}+Q{r}"          # 계좌자동납부 실적합계

[totals]
# 합계 행(target.total_row)에서 세로 합계(SUM)를 넣을 열
columns = ["C", "D", "E", "F", "G", "H", "I", "J", "K", "L", "M", "N", "O", "P", "Q", "R"]

# ===========================================================================
# 로우데이터 시트별 피벗 규칙
# ===========================================================================

[[sources]]
sheet = "2. 파일 및 전문처리건수"
key_column = "금융회사"
ignore_columns = ["날짜"]

# ---------------------------------------------------------------------------
# 항목 정의: column = 계산파일 열, sources = 합산할 로우데이터 열
# 규칙: 앞자리 = 업무 (AT21xx 신규 / AT31xx·AT36xx 해지 / 3100xx·AT30xx 변경)
#       끝자리 = 서비스 (1 지로 / 2 CMS / 3·5·6 펌뱅킹)
#       예외: Payinfo접수분 → CMS 해지, AT1113 → 펌해지내역중계(N열)
# confirmed = true  : 확인된 규칙 / false : 임시 규칙 (실행 시 [주의]로 표시)
# ---------------------------------------------------------------------------

[sources.items."지로 신규등록"]
column = "C"
sources = ["AT2111", "AT2114"]
confirmed = true

[sources.items."지로 해지"]
column = "D"
sources = ["AT3111", "212000", "AT3611"]
confirmed = true

[sources.items."지로 변경"]
column = "E"
sources = ["310001", "AT3011", "300001"]
confirmed = true

[sources.items."CMS 신규등록"]
column = "G"
sources = ["AT2112"]
confirmed = true

[sources.items."CMS 해지"]
column = "H"
sources = ["AT3112", "AT3612", "Payinfo접수분"]
confirmed = true

[sources.items."CMS 변경"]
column = "I"
sources = ["310002", "AT3012"]
confirmed = true

[sources.items."펌뱅킹 신규등록"]
column = "K"
sources = ["AT2113", "AT2115", "AT2116"]
confirmed = true

[sources.items."펌뱅킹 해지"]
column = "L"
sources = ["AT3113", "AT3115", "AT3116"]
confirmed = true

[sources.items."펌뱅킹 변경"]
column = "M"
sources = ["310003", "310005", "310006", "AT3013", "AT3005(은행접수)"]
confirmed = true

[sources.items."펌해지내역중계"]
column = "N"
sources = ["AT1113(펌해지내역중계)"]
confirmed = true

[[sources]]
sheet = "3. 펌중계 배치"
key_column = "FNC_CORP_RPTV_CODE"
ignore_columns = ["BASE_DT"]

[sources.items."펌신규해지등록중계(배치)"]
column = "O"
sources = ["COUNT(BASE_DT)"]
confirmed = true

[[sources]]
sheet = "4. 펌중계 실시간"
key_column = "MSG_RCV_ORG_CODE"
ignore_columns = ["OCUR_DT"]

[sources.items."펌신규해지등록중계(실시간)"]
column = "P"
sources = ["COUNT(OCUR_DT)"]
confirmed = true

[[sources]]
sheet = "5. 펌중계 상세"
key_column = "MSG_RCV_ORG_CODE"
ignore_columns = ["OCUR_DT", "ORG_NAME", "MSG_USE_ORG_CODE"]

[sources.items."펌중계 상세"]
# 계산파일에 넣을 열 없음 → 검토용 피벗 파일에만 출력
sources = ["CNT"]
compare_with = "펌신규해지등록중계(실시간)"
confirmed = true

# ===========================================================================
# 임시 난수 채우기 (실제 데이터가 없는 칸을 테스트용 값으로 채움)
# 실제 데이터를 쓰게 되면 이 블록을 지우세요.
# ===========================================================================

[[dummy_fill]]
sheet = "2. 납부 회비 산출"
column = "D"                 # 카드이동서비스(카드자동납부)
first_row = 9
last_row = 72
min = 1000                   # 4~5자리 난수
max = 99999
seed = 2026                  # 같은 seed 면 항상 같은 값
total_cell = "D73"           # 합계 칸: SUM(D9:D72) 수식으로 다시 넣음

# 고정값 입력 (테스트용): 회비 총액
[[fixed_values]]
sheet = "2. 납부 회비 산출"
cell = "B2"                  # 3사분기 회비 총액 (원)
value = 1465988000           # 약 15억 내외 난수로 정한 고정값

# ===========================================================================
# 수식 채우기: {r} 은 행 번호로 바뀝니다.
# ===========================================================================

[[formula_fill]]
sheet = "2. 납부 회비 산출"
column = "H"                 # 균등회비(64개)
first_row = 9
last_row = 72
formula = "$G$3/64"          # 균등회비 총액 ÷ 참가기관 수 (기관 수가 바뀌면 64 수정)
total_cell = "H73"

# ===========================================================================
# 단수 조정: 반올림 후 합계가 목표값과 정확히 맞도록 맞춤
#   각 행 = base(반올림 값) + 조정분.  부족분(또는 초과분)을 unit 개수로 바꿔서
#   rank_column 값이 큰 기관부터 unit 씩 더함(초과면 뺌).
#   값이 같은 기관이 있으면 위쪽 행이 먼저 조정됨.
#   계산파일 안에 수식으로 들어가므로, 엑셀에서 값을 바꿔도 다시 맞춰짐.
#   base       : 한 행의 수식 ({r} = 행 번호)
#   base_range : 같은 수식을 범위 전체로 쓴 것 (합계 계산용, SUMPRODUCT 안에 들어감)
# ===========================================================================

[[round_adjust]]
sheet = "2. 납부 회비 산출"
column = "F"                               # 실적 비율 → 합계 1
rank_column = "E"                          # 실적 합계가 큰 기관부터
first_row = 9
last_row = 72
base = "ROUND(E{r}/$E$73,8)"
base_range = "ROUND($E$9:$E$72/$E$73,8)"
target = "1"
unit = "10^-8"                             # 0.000001%

[[round_adjust]]
sheet = "2. 납부 회비 산출"
column = "G"                               # 실적회비 → 합계 = 실적회비 총액(G4)
rank_column = "E"                          # 실적 합계가 큰 기관부터
first_row = 9
last_row = 72
base = "ROUND(F{r}*$G$4,0)"
base_range = "ROUND($F$9:$F$72*$G$4,0)"
target = "$G$4"
unit = "1"                                 # 1원
